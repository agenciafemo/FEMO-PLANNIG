project_id = "hhikmczwbgxqlyfjhtxo"

# WARNING: project_id above does not match norteia-staging
# (hdutqvbnrezwgnledcuv). Do not deploy until the target is explicitly verified.
[functions.meta-oauth-start]
verify_jwt = true

[functions.meta-oauth-callback]
verify_jwt = false

[functions.meta-connection-complete]
verify_jwt = true

[functions.meta-token-backfill]
verify_jwt = true

[functions.meta-connection-health]
verify_jwt = true

[functions.meta-disconnect]
verify_jwt = true

# Worker de publicação: chamado pelo cron (pg_cron) e pelo "publicar agora".
# verify_jwt=false porque ele só processa a fila interna (nenhum input do
# chamador é usado); publicar exige a permissão na criação do agendamento.
[functions.meta-publish]
verify_jwt = false

# Gera a análise de relatório com IA (Gemini). Exige login: usa o token do
# usuário para ler os dados via RLS (só a própria org). A chave do Gemini vem
# do secret GEMINI_API_KEY (nunca do código/frontend).
[functions.generate-report]
verify_jwt = true

# Gera copies e roteiros usando exclusivamente a base estruturada do cliente.
# A funcao valida o usuario e le o contexto via RLS; nao confia no frontend.
[functions.generate-content]
verify_jwt = true

# Gera ARTES (imagens) com IA a partir da direcao visual + referencias de
# design do cliente. Chave do Gemini no servidor; le contexto via RLS.
[functions.generate-image]
verify_jwt = true

# Puxa métricas do Instagram (Insights) para os relatórios estilo Reportei.
# Exige login: valida acesso do usuário ao cliente e usa o token da conexão.
[functions.meta-insights]
verify_jwt = true

# Relatório de tráfego pago (Meta Ads). Exige login; usa o secret
# META_ADS_SYSTEM_TOKEN para ler os anúncios (separado da publicação).
[functions.meta-ads-insights]
verify_jwt = true

# Frase do dia no Dashboard (Gemini). Exige login.
[functions.daily-quote]
verify_jwt = true
